services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/conduit.sqlite
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      CACHE_STORE: file
      FILESYSTEM_DISK: local
    volumes:
      - db_data:/app/database
      - storage_data:/app/storage

volumes:
  db_data:
  storage_data:
